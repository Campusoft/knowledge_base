name: Validar estructura de doc

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar carpetas de doc/
        shell: pwsh
        run: ./scripts/validar-estructura.ps1
